function normalizeUrl(url) {
    const u = String(url || "").trim();
    if (!u)
        return "";
    if (/^https?:\/\//i.test(u))
        return u;
    return "https://" + u.replace(/^\/+/, "");
}
function openExternal(rawUrl) {
    const u = normalizeUrl(rawUrl);
    if (!u)
        return;
    try {
        const w = window.open(u, "_blank", "noopener,noreferrer");
        if (w) {
            try {
                w.opener = null;
            }
            catch (_a) { }
            return;
        }
    }
    catch (_b) { }
    try {
        const a = document.createElement("a");
        a.href = u;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.referrerPolicy = "no-referrer";
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        return;
    }
    catch (_c) { }
    window.location.href = u;
}
function pretty(num) {
    if (num === undefined || num === null || Number.isNaN(num))
        return "—";
    return Intl.NumberFormat(undefined, { maximumFractionDigits: 2 }).format(num);
}
function usePersistedState(key, initial) {
    const [state, setState] = useState(() => {
        try {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : initial;
        }
        catch (_a) {
            return initial;
        }
    });
    useEffect(() => {
        try {
            localStorage.setItem(key, JSON.stringify(state));
        }
        catch (_a) { }
    }, [key, state]);
    return [state, setState];
}

async function fetchCountApiValue(url, timeoutMs = 4000) {
    if (typeof fetch !== "function")
        return null;
    const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = controller ? window.setTimeout(() => controller.abort(), timeoutMs) : null;
    try {
        const res = await fetch(url, {
            method: "GET",
            cache: "no-store",
            signal: controller ? controller.signal : undefined,
        });
        if (!res || !res.ok)
            return null;
        const text = await res.text();
        if (!text)
            return null;
        try {
            const data = JSON.parse(text);
            return typeof data.value === "number" ? data.value : null;
        }
        catch (_a) {
            return null;
        }
    }
    catch (_b) {
        return null;
    }
    finally {
        if (timer)
            window.clearTimeout(timer);
    }
}
function ExternalLink({ href, className, title, children }) {
    const safeHref = normalizeUrl(href);
    return (React.createElement("a", { href: safeHref, target: "_blank", rel: "noopener noreferrer", onClick: (e) => {
            e.preventDefault();
            openExternal(href);
        }, className: className, title: title }, children));
}

function App() {
    const [s, setS] = usePersistedState(STORAGE_KEY, INITIAL_STATE);
    useEffect(() => {
        try {
            const already = localStorage.getItem(WIPE_ONCE_KEY);
            if (already === "1")
                return;
            localStorage.removeItem("ds3dpc_v1_4");
            localStorage.removeItem("ds3dpc_v1_5");
            localStorage.removeItem("ds3dpc_v1_6");
            localStorage.removeItem("ds3dpc_v1_7");
            localStorage.removeItem("ds3dpc_v1_7");
            localStorage.setItem(WIPE_ONCE_KEY, "1");
            setS(INITIAL_STATE);
        }
        catch (_a) { }
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, []);
    const [useCount, setUseCount] = useState(null);
    const jsonInputRef = useRef(null);
    const [lastProjectSave, setLastProjectSave] = useState(null);
    useEffect(() => { if (!s.createdAt)
        setS((prev) => ({ ...prev, createdAt: new Date().toISOString() })); }, [s.createdAt]);
    const counterWarnedRef = useRef(false);
    useEffect(() => {
        let mounted = true;
        (async () => {
            const value = await fetchCountApiValue("https://api.countapi.xyz/hit/drshiela3dprints/ds3dpc-v1-7", 4000);
            if (!mounted)
                return;
            if (typeof value === "number") {
                setUseCount(value);
            }
            else {
                if (!counterWarnedRef.current) {
                    counterWarnedRef.current = true;
                    console.warn("CountAPI unavailable (ignored). The calculator will continue to work.");
                }
                setUseCount(null);
            }
        })();
        return () => {
            mounted = false;
        };
    }, []);
    const currencyObj = CURRENCIES.find((c) => c.code === (s.currency || "PHP")) || CURRENCIES[0];
    const PHP = currencyObj.symbol;
    const setCurrency = (code) => {
        setS({ ...s, currency: code });
    };
    const saveDefaultCurrency = () => {
        try {
            localStorage.setItem("ds3dpc_default_currency", s.currency || "PHP");
        }
        catch (_a) { }
        alert("Default currency saved: " + (s.currency || "PHP"));
    };
    useEffect(() => {
        if (!s.currency) {
            let code = "PHP";
            try {
                code = localStorage.getItem("ds3dpc_default_currency") || "PHP";
            }
            catch (_a) { }
            setS((prev) => ({ ...prev, currency: code }));
        }
    }, []);
    const pricePerGram = useMemo(() => {
        if (s.pricingMode === "fixed")
            return Number(s.fixedPerGram) || 0;
        const p = Number(s.spoolPrice);
        const w = Number(s.spoolWeight);
        return w > 0 ? p / w : 0;
    }, [s.pricingMode, s.fixedPerGram, s.spoolPrice, s.spoolWeight]);
    const weight_g = Number(s.partWeight) > 0 ? Number(s.partWeight) : 0;
    const materialCost = weight_g * pricePerGram;
    const h = Number(s.printTimeHours) || 0;
    const m = Number(s.printTimeMinutes) || 0;
    const sec = Number(s.printTimeSeconds) || 0;
    const printTimeHoursTotal = h + m / 60 + sec / 3600;
    const kwPresetObj = KW_PRESETS.find((p) => p.key === String(s.kwPreset)) || KW_PRESETS[0];
    const avgKw = kwPresetObj.key === "other" ? Number(s.kwCustom) || 0 : Number(kwPresetObj.kw) || 0;
    const modeElec = s.electricityMode || "wattage";
    let electricityCost = 0;
    if (modeElec === "kw") {
        electricityCost = avgKw * printTimeHoursTotal * (Number(s.kwhPrice) || 0);
    }
    else if (modeElec === "php_per_hour") {
        electricityCost = (Number(s.electricityPhpPerHour) || 0) * printTimeHoursTotal;
    }
    else {
        const watt = Number(s.wattage) || 0;
        electricityCost = (watt * printTimeHoursTotal / 1000) * (Number(s.kwhPrice) || 0);
    }
    const packagingCost = Number(s.packaging) || 0;
    const accessoryList = Array.isArray(s.accessories) && s.accessories.length
        ? s.accessories
        : [
            ...(Number(s.accessory1) ? [{ type: "Others", custom: "Accessory 1", cost: s.accessory1 }] : []),
            ...(Number(s.accessory2) ? [{ type: "Others", custom: "Accessory 2", cost: s.accessory2 }] : []),
        ];
    const accessoriesCost = accessoryList.reduce((sum, a) => sum + (Number(a.cost) || 0), 0);
    const paintCost = Number(s.paint) || 0;
    const adhesivesCost = Number(s.adhesives) || 0;
    const shippingCost = Number(s.shipping) || 0;
    const modelingFeeCost = Number(s.modelingFee) || 0;
    const laborCostNum = Number(s.laborCost) || 0;
    const coreCost = materialCost + electricityCost + laborCostNum;
    const otherCosts = packagingCost + accessoriesCost + paintCost + adhesivesCost + shippingCost + modelingFeeCost;
    const baseSubtotal = coreCost + otherCosts;
    const failureMarginRate = Number(s.failureMarginPct) || 0;
    const failureMarginAmount = coreCost * (failureMarginRate / 100);
    const markupRate = Number(s.markupPct) || 0;
    const markupAmount = coreCost * (markupRate / 100);
    const finalPrice = baseSubtotal + failureMarginAmount + markupAmount;
    const safeFileName = () => {
        const name = (s.productName || "Untitled_Product").trim().replace(/[^a-z0-9_-]+/gi, "_").replace(/^_+|_+$/g, "") || "Untitled_Product";
        return `${name}_${new Date().toISOString().slice(0, 10)}`;
    };
    const createdDate = () => { const d = s.createdAt ? new Date(s.createdAt) : new Date(); return d.toLocaleString(); };
    const downloadBlob = (blob, filename) => { const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u); };
    const currentEntry = () => { const { saves, ...data } = s; return { name: s.productName || "Untitled Product", ts: Date.now(), data }; };
    const saveJSON = () => { const createdAt = s.createdAt || new Date().toISOString(); const payload = { format: "DS3DPC Project", version: "1.8", createdAt, state: { ...s, createdAt, saves: [] } }; downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }), safeFileName() + ".json"); setLastProjectSave(Date.now()); };
    const loadJSONFile = async (file) => { if (!file)
        return; try {
        const obj = JSON.parse(await file.text());
        const d = obj.state || obj.data || obj;
        const migrated = Array.isArray(d.accessories) ? d.accessories : [...(Number(d.accessory1) ? [{ type: "Others", custom: "Accessory 1", cost: d.accessory1 }] : []), ...(Number(d.accessory2) ? [{ type: "Others", custom: "Accessory 2", cost: d.accessory2 }] : [])];
        setS({ ...INITIAL_STATE, ...d, createdAt: (d.createdAt || obj.createdAt || new Date().toISOString()), accessories: migrated, saves: s.saves });
        setLastProjectSave(Date.now());
    }
    catch (_a) {
        alert("This JSON project file could not be loaded.");
    } };
    const money = (n) => `${PHP} ${pretty(Number(n) || 0)}`;
    const timeText = () => {
        const parts = [];
        if (h) parts.push(`${h} hr`);
        if (m) parts.push(`${m} min`);
        if (sec) parts.push(`${sec} sec`);
        return parts.length ? parts.join(" ") : "0 min";
    };
    const materialMethodText = () => s.pricingMode === "fixed"
        ? `Fixed price/gram: ${PHP} ${pretty(pricePerGram)}/g`
        : `Spool: ${money(s.spoolPrice)} / ${pretty(Number(s.spoolWeight) || 0)} g  →  ${PHP} ${pretty(pricePerGram)}/g`;
    const electricityDetails = () => {
        if (modeElec === "kw") return [
            ["Method", "Average power from monitoring device"],
            ["Printer / preset", kwPresetObj.label],
            ["Average power", `${pretty(avgKw)} kW`],
            ["Electricity rate", `${PHP} ${pretty(Number(s.kwhPrice) || 0)}/kWh`],
            ["Print time", timeText()]
        ];
        if (modeElec === "php_per_hour") return [
            ["Method", "Fixed electricity cost per print hour"],
            ["Cost per hour", `${PHP} ${pretty(Number(s.electricityPhpPerHour) || 0)}/hr`],
            ["Print time", timeText()]
        ];
        return [
            ["Method", "Printer wattage × print time"],
            ["Printer wattage", `${pretty(Number(s.wattage) || 0)} W`],
            ["Electricity rate", `${PHP} ${pretty(Number(s.kwhPrice) || 0)}/kWh`],
            ["Print time", timeText()]
        ];
    };
    const recordSections = () => [
        { title: "PRODUCT DETAILS", rows: [
            ["Date Created", createdDate()]
        ]},
        { title: "MATERIAL", rows: [
            ["Pricing method", materialMethodText()],
            ["Filament consumed", `${pretty(weight_g)} g`],
            ["Price per gram", `${PHP} ${pretty(pricePerGram)}/g`],
            ["Material Cost", money(materialCost), "total"]
        ]},
        { title: "PRINT & ELECTRICITY", rows: [
            ...electricityDetails(),
            ["Electricity Cost", money(electricityCost), "total"]
        ]},
        { title: "LABOR", rows: [
            ["Labor Cost", money(laborCostNum), "total"]
        ]},
        { title: "ACCESSORIES & OTHER COSTS", rows: [
            ...(accessoryList.length
                ? accessoryList.map(a => [
                    a.type === "Others" && a.custom ? a.custom : (a.type || "Accessory"),
                    money(Number(a.cost) || 0)
